<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        background: #fafafa;
      }
    </style>
  </head>
  <body>
    <div id="demo"></div>

    <script type="module">
      import { html, render } from 'lit';
      import '../dist/src/biowc-scatter.js';
      import ScatterPlotFixture from '../dist/test/fixtures/ScatterPlotFixture.js';

      render(
        html`
          <biowc-scatter
            .idKey="${ScatterPlotFixture.scatterPlot.idKey}"
            .valueKey="${ScatterPlotFixture.scatterPlot.valueKey}"
            .xLabel="${ScatterPlotFixture.scatterPlot.xLabel}"
            .yLabel="${ScatterPlotFixture.scatterPlot.yLabel}"
            .xValues="${ScatterPlotFixture.scatterPlot.xValues}"
            .yValues="${ScatterPlotFixture.scatterPlot.yValues}"
            .categories="${ScatterPlotFixture.scatterPlot.categories}"
            .colors="${ScatterPlotFixture.scatterPlot.colors}"
            .showTrendline="${ScatterPlotFixture.scatterPlot.showTrendline}"
            .showLegend="${ScatterPlotFixture.scatterPlot.showLegend}"
            .legendPosition="${ScatterPlotFixture.scatterPlot.legendPosition}"
            .lines="${ScatterPlotFixture.scatterPlot.lines}"
          >
            some light-dom

        `,

        document.querySelector('#demo')
      );
    </script>
